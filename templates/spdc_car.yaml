name: SPDC pair source, coincidence and CAR
description: >
  405 nm CW pump focused into a 10 mm type-II PPKTP crystal. After the pump-blocking long-pass and
  an 810 nm band-pass a PBS splits the H signal and V idler into two single-mode fibers and two
  SPADs. The coincidence analysis gives the pair rate, the accidentals and the
  coincidence-to-accidental ratio (CAR). All parts are generic placeholders.
instances:
  - {id: pump, part: sources/laser_405_cw, position: [0, 0]}
  - {id: pump_lens, part: freespace/lens_f200mm, position: [5, 0]}
  - {id: crystal, part: nonlinear/ppktp_type2_10mm, position: [11, 0]}
  - {id: collect_lens, part: freespace/lens_f200mm, position: [17, 0]}
  - {id: lp, part: filters/lp_650_pumpblock, position: [22, 0]}
  - {id: bp, part: filters/bp_810_10nm, position: [26, 0]}
  - {id: pbs, part: polarization/pbs_cube_810, position: [30, 0]}
  - {id: cpl_s, part: fiber/coupler_f11mm_810, position: [35, 0]}
  - {id: cpl_i, part: fiber/coupler_f11mm_810, position: [30, 5], rotation: 90}
  - {id: spad_s, part: detectors/spad_si_generic, position: [41, 0]}
  - {id: spad_i, part: detectors/spad_si_generic, position: [36, 7]}
  - {id: tagger, part: electronics/tagger_generic_4ch, position: [47, 3]}
links:
  - {id: s_pump, kind: free_space, from: pump.out, to: pump_lens.in, length: 100 mm}
  - {id: s_focus, kind: free_space, from: pump_lens.out, to: crystal.in, length: 195 mm}
  - {id: s_collect, kind: free_space, from: crystal.out, to: collect_lens.in, length: 197 mm}
  - {id: s_lp, kind: free_space, from: collect_lens.out, to: lp.in, length: 50 mm}
  - {id: s_bp, kind: free_space, from: lp.out, to: bp.in, length: 25 mm}
  - {id: s_pbs, kind: free_space, from: bp.out, to: pbs.in, length: 25 mm}
  - {id: s_signal, kind: free_space, from: pbs.out_t, to: cpl_s.in, length: 100 mm}
  - {id: s_idler, kind: free_space, from: pbs.out_r, to: cpl_i.in, length: 100 mm}
  - {id: f_signal, kind: fiber, from: cpl_s.out, to: spad_s.in, fiber: fiber/smf_810, length: 2 m}
  - {id: f_idler, kind: fiber, from: cpl_i.out, to: spad_i.in, fiber: fiber/smf_810, length: 2 m}
  - {id: c_s, kind: cable, from: spad_s.out, to: tagger.ch1, delay: 0 ns}
  - {id: c_i, kind: cable, from: spad_i.out, to: tagger.ch2, delay: 0 ns}
analyses:
  - {name: pairs, type: coincidences, channels: [tagger.ch1, tagger.ch2], window: 1 ns, center: auto}
