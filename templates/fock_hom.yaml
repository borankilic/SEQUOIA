name: Two-photon interference of Fock-state photons
description: >
  Two single-photon Fock sources (exactly one 810 nm photon per pulse, 80 MHz) meet on a first
  50:50 beam splitter (Hong-Ou-Mandel bunching), pass through a phase shifter in one arm and are
  recombined on a second 50:50 beam splitter read by two SPADs and a time tagger. With equal
  photons the probability that both detectors see a photon is cos^2 of the phase set on the
  phase shifter (1 at 0 deg, 0 at 90 deg: the photons leave together, the N00N-state fringe);
  distinguishable photons give 1 - sin^2/2 and no full contrast. Open the Photon counts tab: it
  reads the drawn circuit, lists its components and gives output-state probabilities, expected
  counts and detector click patterns. Change a source's distinguishability_tag to make the
  photons distinguishable. Idealisation: deterministic single photons at 80 MHz give about 44
  million potential clicks per second per SPAD, far beyond its 50 ns dead time; the Photon counts
  tab omits dead time and flags this regime, so read its rates as potential clicks, not
  recorded counts. All parts are generic placeholders; replace them with the lab's measured
  parts.
