[project]
name = "sequoia"
version = "0.1.0"
description = "Simulated Evaluation of QUantum Optics Instruments and Analysis"
readme = "README.md"
authors = [
    { name = "borankilic", email = "boranaybak34@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.7",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pint>=0.26.1",
    "pydantic>=2.14.0",
    "pyqtgraph>=0.14.0",
    "pyside6-essentials>=6.12.0",
    "ruamel-yaml>=0.19.1",
    "scipy>=1.18.1",
    "spdcalc-py>=1.0.1",
]

[project.scripts]
sequoia = "sequoia.cli:main"

[project.optional-dependencies]
gaussian = [
    "thewalrus>=0.22.0",
]
perceval = [
    "perceval-quandela>=1.3.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.10",
]
